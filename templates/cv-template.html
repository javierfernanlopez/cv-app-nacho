<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV - Ignacio Fernández López</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 7mm 11mm;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background: #fff;
      line-height: 1.25;
      font-size: 8.7pt;
    }
    .page-container {
      width: 100%;
      max-width: 210mm;
      margin: 0 auto;
      background: #fff;
    }
    /* Cabecera con foto en flujo lineal para ATS */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.8px solid #1a568c;
      padding-bottom: 5px;
      margin-bottom: 6px;
    }
    .header-text {
      flex: 1;
    }
    .header-text h1 {
      font-size: 17.5pt;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.4px;
      margin-bottom: 1px;
    }
    .header-text .role-title {
      font-size: 9.8pt;
      font-weight: 600;
      color: #1a568c;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .contact-info {
      font-size: 8.3pt;
      color: #444;
      line-height: 1.3;
    }
    .contact-info a {
      color: #1a568c;
      text-decoration: none;
    }
    .header-photo {
      margin-left: 14px;
      flex-shrink: 0;
    }
    .header-photo img {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #1a568c;
      display: block;
    }
    /* Secciones ATS */
    section {
      margin-bottom: 5px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    h2 {
      font-size: 9.2pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #1a568c;
      border-bottom: 1px solid #d2dbe3;
      padding-bottom: 1.5px;
      margin-bottom: 4px;
    }
    p.summary {
      font-size: 8.6pt;
      color: #2b2b2b;
      text-align: justify;
      line-height: 1.26;
    }
    .item {
      margin-bottom: 4px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .item:last-child {
      margin-bottom: 0;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      font-size: 8.9pt;
      font-weight: 700;
      color: #111;
    }
    .item-subheader {
      display: flex;
      justify-content: space-between;
      font-size: 8.3pt;
      color: #444;
      font-style: italic;
      margin-bottom: 1.5px;
    }
    ul {
      margin-left: 14px;
      list-style-type: disc;
    }
    li {
      font-size: 8.4pt;
      color: #262626;
      margin-bottom: 1px;
      line-height: 1.24;
    }
    .skills-group {
      font-size: 8.4pt;
      margin-bottom: 1.5px;
      color: #2b2b2b;
      line-height: 1.24;
    }
    .skills-group strong {
      color: #111;
      font-weight: 600;
    }

    @media print {
      body {
        background: #fff;
        font-size: 9pt;
      }
      .page-container {
        padding: 0;
        margin: 0;
        max-width: none;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

<div class="page-container">
  <header class="header">
    <div class="header-text">
      <h1>{{NAME}}</h1>
      <div class="role-title">{{ROLE_TITLE}}</div>
      <div class="contact-info">
        {{PHONE}} &nbsp;|&nbsp; <a href="mailto:{{EMAIL}}">{{EMAIL}}</a> &nbsp;|&nbsp; {{LOCATION}} &nbsp;|&nbsp; 
        <a href="{{LINKEDIN_URL}}" target="_blank">{{LINKEDIN_DISPLAY}}</a>
      </div>
    </div>
    {{PHOTO_HTML}}
  </header>

  <section>
    <h2>Perfil Profesional</h2>
    <p class="summary">{{SUMMARY}}</p>
  </section>

  <section>
    <h2>Experiencia Laboral</h2>
    {{EXPERIENCE_HTML}}
  </section>

  <section>
    <h2>Educación y Formación</h2>
    {{EDUCATION_HTML}}
  </section>

  <section>
    <h2>Habilidades, Competencias e Idiomas</h2>
    {{SKILLS_HTML}}
  </section>

  {{PROJECTS_HTML}}
</div>

</body>
</html>
